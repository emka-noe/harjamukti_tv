<script id="one-page-auto-scroll">
(function(){
  function setup(){
    try{
      var root=document.getElementById('root');
      if(!root) return;
      var main=root.querySelector('main');
      if(main){ main.style.width='100%'; main.style.minWidth='0'; }
      var aside=root.querySelector('aside');
      if(aside) aside.style.display='none';

      var candidates=root.querySelectorAll('div.flex-1.overflow-auto');
      var board=null;
      for(var i=0;i<candidates.length;i++){
        var el=candidates[i];
        if(el.querySelector('div.min-w-\\[820px\\]') || el.scrollHeight>el.clientHeight){
          board=el; break;
        }
      }
      if(!board && candidates.length) board=candidates[candidates.length-1];
      if(!board) return;
      board.id='auto-scroll-board';
      board.style.overflowY='auto';
      board.style.overflowX='hidden';
      board.style.scrollbarWidth='none';

      if(board.__autoScrollStarted) return;
      board.__autoScrollStarted=true;
      var paused=false, timer=null, raf=null;
      board.addEventListener('mouseenter',function(){paused=true});
      board.addEventListener('mouseleave',function(){paused=false});
      function tick(){
        if(!paused && board.scrollHeight>board.clientHeight){
          board.scrollTop += 0.7;
          if(board.scrollTop + board.clientHeight >= board.scrollHeight-2){
            if(!timer){
              timer=setTimeout(function(){
                timer=null;
                board.scrollTop=0;
              },1500);
            }
          }
        }
        raf=requestAnimationFrame(tick);
      }
      raf=requestAnimationFrame(tick);
    }catch(e){ console.error('Auto-scroll setup error:',e); }
  }
  var tries=0;
  var iv=setInterval(function(){
    setup();
    if(++tries>100) clearInterval(iv);
  },100);
  if(document.readyState!=='loading') setup();
  else document.addEventListener('DOMContentLoaded',setup);
})();
</script>

<script id="mk-exact-revision-runtime-v3">
(function(){
  function applyChanges(){
    /* Find the exact blue gradient row used by the original page. */
    var blue = Array.from(document.querySelectorAll('div')).find(function(el){
      var c = typeof el.className === 'string' ? el.className : '';
      return c.indexOf('bg-gradient-to-r') !== -1 &&
             c.indexOf('from-[#0F2A5A]') !== -1 &&
             c.indexOf('to-[#1E4BA5]') !== -1;
    });

    if(blue){
      blue.classList.add('mk-blue-clock-panel');

      var children = Array.from(blue.children);

      /* First child contains the AMAN NYAMAN CERDAS image + mobile clock. */
      if(children[0]){
        children[0].classList.add('mk-blue-logo');
        /* Keep its clock/date on phones; remove only the image. */
        var imgs = children[0].querySelectorAll('img');
        imgs.forEach(function(img){ img.style.setProperty('display','none','important'); });

        var mobileClock = children[0].querySelector('.lg\\:hidden');
        if(mobileClock){
          mobileClock.classList.remove('text-right');
          mobileClock.classList.add('mk-blue-clock-mobile');
          mobileClock.style.setProperty('display','flex','important');
          mobileClock.style.setProperty('flex-direction','column','important');
          mobileClock.style.setProperty('align-items','center','important');
        }
        /* Don't hide the whole first child because mobile clock lives here. */
        children[0].style.setProperty('display','flex','important');
        children[0].style.setProperty('align-items','center','important');
        children[0].style.setProperty('justify-content','center','important');
        children[0].style.setProperty('width','100%','important');
      }

      /* Second child is the moving text inside the blue panel. */
      if(children[1]){
        children[1].classList.add('mk-blue-marquee');
      }

      /* Third child is the desktop clock/date. */
      if(children[2]){
        children[2].classList.add('mk-blue-clock-desktop');
      }
    }

    /* Exact top yellow announcement: find the yellow bar containing
       the anti-calo announcement and hide that bar only. */
    Array.from(document.querySelectorAll('div')).forEach(function(el){
      var text=(el.textContent||'').trim();
      var c=typeof el.className==='string'?el.className:'';
      if(text.indexOf('HIMBAUAN:')!==-1 &&
         text.indexOf('Belilah tiket hanya di LOKET RESMI')!==-1 &&
         c.indexOf('bg-[#FFB800]')!==-1){
        var r=el.getBoundingClientRect();
        /* The top announcement is immediately below the blue panel. */
        if(r.top < window.innerHeight*0.5 && r.height < 100){
          el.classList.add('mk-top-yellow-announcement');
        }
      }
    });

    /* Footer ticker: accelerate the actual footer animation. */
    var footer=document.querySelector('footer');
    if(footer){
      footer.querySelectorAll('[class*="animate-[marquee_"]').forEach(function(el){
        el.classList.add('mk-fast-footer-ticker');
        el.classList.add('mk-footer-info-running');
        el.style.setProperty('animation','footerInfoTerminalMarquee 30s linear infinite','important');
        el.style.setProperty('animation-duration','30s','important');
      });
    }
  }

  /* React renders after this script is parsed, so observe until the layout exists. */
  applyChanges();
  var observer=new MutationObserver(function(){
    applyChanges();
  });
  observer.observe(document.getElementById('root') || document.body,{childList:true,subtree:true});

  setTimeout(function(){ observer.disconnect(); applyChanges(); },5000);
})();
</script>
